services:
  # ── Download historical data ────────────────────────────────────────────────
  dataloader:
    build: .
    command: python dataloader.py
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=data
    profiles: [setup]

  # ── Train the model ─────────────────────────────────────────────────────────
  train:
    build: .
    command: python train.py
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=data
    profiles: [setup]

  # ── Evaluate the model ──────────────────────────────────────────────────────
  evaluate:
    build: .
    command: python evaluate.py
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=data
    profiles: [setup]

  # ── Live signal stream (always-on, logs to stdout) ──────────────────────────
  live:
    build: .
    command: python live.py --no-sound
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "50"

  # ── FastAPI signal endpoint ──────────────────────────────────────────────────
  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=data
    ports:
      - "8000:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "50"