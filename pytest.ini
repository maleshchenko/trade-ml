[pytest]
# Pytest configuration for Trade ML project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:anchorpy

# Markers for organizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for multiple components
    slow: Tests that take a long time to run
    api: Tests that make API calls
    model: Tests for the LSTM model
    features: Tests for feature engineering
    dataloader: Tests for data loading functionality

testpaths = tests
